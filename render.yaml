# Render Blueprint — production topology for AthenaeumAI.
#
# Reviewable in Git rather than living only in a dashboard. Apply with
# "New > Blueprint" in Render, pointing at this file.
#
# NO SECRET VALUES BELONG IN THIS FILE. Every credential is declared `sync: false`,
# which tells Render to prompt for the value at apply time and keep it out of Git.
# Values are never read from this repository.
#
# ── Required before the first apply ────────────────────────────────────────────
#
# MongoDB is NOT declared here. It has to be an existing MongoDB Atlas cluster,
# because the durable attempt claim and quiz generation both refuse to run
# multi-document transactions against a standalone mongod. Atlas deployments are
# replica sets, which is what those code paths require. Set MONGODB_URI to a
# replica-set connection string:
#
#   mongodb+srv://<user>:<password>@<cluster>.mongodb.net/?retryWrites=true&w=majority
#
# Then run `npm run indexes:sync` once against the production database, from the
# API service. It reconciles the per-question ReviewQueue index. Mongoose's
# autoIndex will not widen an index that already exists, so skipping this step
# leaves a stale index that rejects the rows the current code writes.

services:
  # ── Redis / Valkey backing the BullMQ queue ──────────────────────────────────
  key-value:
    type: keyvalue
    name: athenaeum-redis
    plan: starter
    region: oregon
    ipAllowList: [] # private networking only; nothing reaches it from the internet

  # ── Express API ──────────────────────────────────────────────────────────────
  api:
    type: web
    name: athenaeum-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    # Not `npm run dev`: that is nodemon. `start` is plain `node server.js`.
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns the port; the app must not assume 5000.
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Optional. Unset, the provider uses openai/gpt-oss-120b. Set it to move
      # models without a code change — list what your key can reach with:
      #   curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
      - key: GROQ_MODEL
        sync: false
      # The BullMQ queue is live in production: it is only auto-disabled under
      # NODE_ENV=test.
      - key: ENABLE_JOB_QUEUE
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: athenaeum-redis
          property: connectionString
      # Comma-separated. In production this is the ONLY allow-list; there is no
      # localhost fallback.
      - key: ALLOWED_ORIGINS
        sync: false

  # ── BullMQ worker ────────────────────────────────────────────────────────────
  # Separate from the API because quiz generation, material indexing and attempt
  # sync are long-running: a five-question quiz takes roughly two minutes on the
  # current reasoning model, which must not occupy an HTTP request.
  worker:
    type: worker
    name: athenaeum-worker
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: node worker.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: ENABLE_JOB_QUEUE
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: athenaeum-redis
          property: connectionString

  # ── Frontend ─────────────────────────────────────────────────────────────────
  # A static site, not a web service: the bundle is served as files.
  frontend:
    type: static
    name: athenaeum-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      # Baked into the bundle at build time. The production build throws if this
      # is unset rather than silently addressing localhost.
      - key: VITE_API_ROOT
        sync: false
    routes:
      # Client-side routing: /tutor, /review, /assessments/:id/result and friends
      # have no file behind them and must resolve to the SPA entry point.
      - type: rewrite
        source: /*
        destination: /index.html
