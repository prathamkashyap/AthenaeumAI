<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The root is now the public landing page, so this metadata is what a search
         result or a shared link actually shows. It used to say "AI-powered quiz
         generation platform", which describes the feature and none of the loop. -->
    <title>Athenaeum AI — Turn your syllabus into mastery you can prove</title>
    <meta
      name="description"
      content="Upload a PDF and Athenaeum AI writes exam-style questions from your own material, tracks which topics you actually got wrong, and schedules revision from that evidence. Runs entirely on free tiers."
    />
    <meta name="author" content="Athenaeum AI" />
    <link rel="canonical" href="https://athenaeumai.tech/" />

    <meta property="og:site_name" content="Athenaeum AI" />
    <meta property="og:title" content="Athenaeum AI — Turn your syllabus into mastery you can prove" />
    <meta
      property="og:description"
      content="Upload material, generate exam-style questions from it, and see real topic mastery from your own attempts. Upload, generate, attempt, measure, revise."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://athenaeumai.tech/" />

    <!-- Was summary_large_image with no og:image anywhere, which asks for a large
         card the page cannot supply. Dropped to summary; it goes back to
         summary_large_image when a real social image lands with the screenshots. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Athenaeum AI — Turn your syllabus into mastery you can prove" />
    <meta
      name="twitter:description"
      content="Exam-style questions generated from your own material, and a mastery map built from your real attempts. Free tiers throughout."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
