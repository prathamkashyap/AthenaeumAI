name: CI — AthenaeumAI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: Lint, Unit Tests, Integration Tests ─────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/athenaeumAI_test
      MONGODB_URI_TEST: mongodb://localhost:27017/athenaeumAI_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      GROQ_API_KEY: test-key-not-real
      PORT: 5001
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # MongoDB is started as a step rather than declared under `services:`
      # because a service container runs the image's default command, and
      # mongo:7's default command has no --replSet. A standalone server cannot
      # run the multi-document transaction that SYNC_ATTEMPT depends on, so the
      # real transaction path would be impossible to exercise in CI. Redis
      # remains an ordinary service.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name athenaeum-mongo-rs \
            -p 27017:27017 \
            mongo:7 mongod --replSet rs0 --bind_ip_all

      - name: Initialize the replica set and wait for PRIMARY
        run: |
          cat > init-replica-set.mjs <<'EOF'
          import { MongoClient } from "mongodb";

          const uri = "mongodb://localhost:27017/?directConnection=true";
          const client = new MongoClient(uri, { serverSelectionTimeoutMS: 10000 });

          // mongod accepts connections moments before it is reachable, so the
          // first connect races the container finishing its startup.
          let connected = false;
          for (let attempt = 1; attempt <= 30 && !connected; attempt += 1) {
            try {
              await client.connect();
              connected = true;
            } catch (error) {
              if (attempt === 30) throw error;
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
          }

          // --replSet alone does not create the set: without this command the
          // deployment stays uninitialized and transactions stay unavailable.
          await client
            .db("admin")
            .command({
              replSetInitiate: {
                _id: "rs0",
                members: [{ _id: 0, host: "localhost:27017" }],
              },
            })
            .catch((error) => {
              // Re-running the step against an already-initialized set is fine.
              if (!/already initialized/i.test(error.message)) throw error;
            });

          let primary = false;
          for (let attempt = 1; attempt <= 60 && !primary; attempt += 1) {
            const status = await client.db("admin").command({ replSetGetStatus: 1 });
            primary = status.members.some((member) => member.stateStr === "PRIMARY");
            if (!primary) await new Promise((resolve) => setTimeout(resolve, 1000));
          }

          // Fail loudly rather than letting the integration suite run against a
          // deployment that silently cannot transact.
          if (!primary) throw new Error("MongoDB replica set rs0 never reached PRIMARY.");

          const hello = await client.db("admin").command({ hello: 1 });
          console.log(
            "Replica set " + hello.setName + " is PRIMARY (writable=" + hello.isWritablePrimary + ")",
          );
          await client.close();
          EOF
          node init-replica-set.mjs
          rm -f init-replica-set.mjs

      - name: Run unit tests with coverage
        run: node --experimental-vm-modules node_modules/.bin/jest --testPathPatterns=tests/unit --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Run integration tests
        run: ENABLE_JOB_QUEUE=true node --experimental-vm-modules node_modules/.bin/jest --testPathPatterns=tests/integration --runInBand --forceExit
        timeout-minutes: 5

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # ─── Frontend: Type Check & Build Verification ────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # `npx tsc --noEmit` at the repository root resolves tsconfig.json, which is
      # a solution-style config with "files": [] and project references — it
      # type-checks nothing and reports success unconditionally. The frontend is
      # described by tsconfig.app.json, so that is the project this must build.
      - name: TypeScript type check
        run: npm run typecheck

      # These suites ran only on developer machines, so a green PR could mean the
      # frontend was never actually tested. Placed before the build so a failure
      # stops the artifact from being produced.
      - name: Frontend unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_ROOT: http://localhost:5001/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ─── Playwright E2E Tests ────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Run on every pull request as well as on main, so the PR proves the system
    # before it merges instead of surfacing E2E failures after main has it.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/athenaeumAI_e2e
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      GROQ_API_KEY: test-key-not-real
      PORT: 5001
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      VITE_API_ROOT: http://localhost:5001/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install all dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=html
        timeout-minutes: 10

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
